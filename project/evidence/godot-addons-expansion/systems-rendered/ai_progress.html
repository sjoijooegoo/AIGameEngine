<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续帧检查</title>
<style>body{margin:24px;background:#edf1f4;color:#183244;font:16px/1.5 sans-serif}main{max-width:1280px;margin:auto}img{width:100%;background:#183244}button,select,input{font:inherit;margin:8px;padding:6px}input{width:55%}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:white;padding:16px}button:focus-visible{outline:3px solid #c39554}</style><main>
<h1>连续帧检查</h1><p>按模拟时间播放；原图和状态保留在同一目录。此回放不包含声音，不是实际帧率测量。</p>
<img id="frame" alt="当前游戏渲染帧"><div><button id="toggle">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25 倍</option><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option></select><input id="position" type="range" min="0" value="0" aria-label="帧位置"><span id="label"></span></div><details><summary>当前帧状态</summary><pre id="state"></pre></details>
<script>const frames=[{"path": "ai_progress_000.png", "time": 0.0, "state": {"ai_mode": "警戒", "ai_progress": 0.3625, "ai_ticks": 65, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 65}}, {"path": "ai_progress_001.png", "time": 0.1, "state": {"ai_mode": "警戒", "ai_progress": 0.4175, "ai_ticks": 71, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 71}}, {"path": "ai_progress_002.png", "time": 0.2, "state": {"ai_mode": "警戒", "ai_progress": 0.4725, "ai_ticks": 77, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 77}}, {"path": "ai_progress_003.png", "time": 0.3, "state": {"ai_mode": "警戒", "ai_progress": 0.5275, "ai_ticks": 83, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 83}}, {"path": "ai_progress_004.png", "time": 0.4, "state": {"ai_mode": "警戒", "ai_progress": 0.5825, "ai_ticks": 89, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 89}}, {"path": "ai_progress_005.png", "time": 0.5, "state": {"ai_mode": "警戒", "ai_progress": 0.6375, "ai_ticks": 95, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 95}}, {"path": "ai_progress_006.png", "time": 0.6, "state": {"ai_mode": "警戒", "ai_progress": 0.692499999999999, "ai_ticks": 101, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 101}}, {"path": "ai_progress_007.png", "time": 0.7, "state": {"ai_mode": "警戒", "ai_progress": 0.747499999999999, "ai_ticks": 107, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 107}}, {"path": "ai_progress_008.png", "time": 0.8, "state": {"ai_mode": "警戒", "ai_progress": 0.802499999999999, "ai_ticks": 113, "alert": true, "busy": false, "dialogue_id": "", "has_keycard": true, "manual_ai": true, "paused": false, "responses": 0, "text": "终端已关闭。可再次调查。", "tick": 113}}],fps=10.0;let index=0,timer=null;const el=id=>document.getElementById(id);el('position').max=frames.length-1;function show(){const f=frames[index];el('frame').src=f.path;el('position').value=index;el('label').textContent=`${index+1}/${frames.length} · ${f.time.toFixed(3)} 秒`;el('state').textContent=JSON.stringify(f.state,null,2);}function stop(){clearInterval(timer);timer=null;el('toggle').textContent='播放';}function play(){stop();el('toggle').textContent='暂停';timer=setInterval(()=>{index=(index+1)%frames.length;show();},1000/fps/Number(el('speed').value));}el('toggle').onclick=()=>timer?stop():play();el('prev').onclick=()=>{stop();index=Math.max(0,index-1);show();};el('next').onclick=()=>{stop();index=Math.min(frames.length-1,index+1);show();};el('position').oninput=e=>{stop();index=Number(e.target.value);show();};el('speed').onchange=()=>{if(timer)play();};show();</script></main></html>
