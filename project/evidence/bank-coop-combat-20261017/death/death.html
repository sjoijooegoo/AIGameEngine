<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续帧检查</title>
<style>body{margin:24px;background:#edf1f4;color:#183244;font:16px/1.5 sans-serif}main{max-width:1280px;margin:auto}img{width:100%;background:#183244}button,select,input{font:inherit;margin:8px;padding:6px}input{width:55%}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:white;padding:16px}button:focus-visible{outline:3px solid #c39554}</style><main>
<h1>连续帧检查</h1><p>按模拟时间播放；原图和状态保留在同一目录。此回放不包含声音，不是实际帧率测量。</p>
<img id="frame" alt="当前游戏渲染帧"><div><button id="toggle">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25 倍</option><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option></select><input id="position" type="range" min="0" value="0" aria-label="帧位置"><span id="label"></span></div><details><summary>当前帧状态</summary><pre id="state"></pre></details>
<script>const frames=[{"path": "capture_95.png", "time": 3.4, "state": {"kills": 0, "target": {"active": true, "hp": 9.0, "id": "G_mon", "mode": "idle", "position": [20.0, -0.0097395833581686, -10.0]}}}, {"path": "capture_98.png", "time": 3.5, "state": {"kills": 1, "target": {"active": true, "hp": 0.0, "id": "G_mon", "mode": "dead", "position": [20.0, -0.0097395833581686, -10.0]}}}, {"path": "capture_101.png", "time": 3.6, "state": {"kills": 1, "target": {"active": true, "hp": 0.0, "id": "G_mon", "mode": "dead", "position": [20.0, -0.0097395833581686, -10.0]}}}, {"path": "capture_104.png", "time": 3.7, "state": {"kills": 1, "target": {"active": true, "hp": 0.0, "id": "G_mon", "mode": "dead", "position": [20.0, -0.0097395833581686, -10.0]}}}, {"path": "capture_107.png", "time": 3.8, "state": {"kills": 1, "target": {"active": true, "hp": 0.0, "id": "G_mon", "mode": "dead", "position": [20.0, -0.0097395833581686, -10.0]}}}],fps=10;let index=0,timer=null;const el=id=>document.getElementById(id);el('position').max=frames.length-1;function show(){const f=frames[index];el('frame').src=f.path;el('position').value=index;el('label').textContent=`${index+1}/${frames.length} · ${f.time.toFixed(3)} 秒`;el('state').textContent=JSON.stringify(f.state,null,2);}function stop(){clearInterval(timer);timer=null;el('toggle').textContent='播放';}function play(){stop();el('toggle').textContent='暂停';timer=setInterval(()=>{index=(index+1)%frames.length;show();},1000/fps/Number(el('speed').value));}el('toggle').onclick=()=>timer?stop():play();el('prev').onclick=()=>{stop();index=Math.max(0,index-1);show();};el('next').onclick=()=>{stop();index=Math.min(frames.length-1,index+1);show();};el('position').oninput=e=>{stop();index=Number(e.target.value);show();};el('speed').onchange=()=>{if(timer)play();};show();</script></main></html>
