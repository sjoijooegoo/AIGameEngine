<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>银行危机</title>
<style>
:root{
  --black:#000; --panel:#0d2126; --panel2:#153238; --line:#2f5a5f;
  --bone:#dcd4bb; --dim:#8c907c; --blood:#a11d1d; --ecg:#74d96b; --caution:#dcb842; --brass:#bb9852;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Microsoft YaHei",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --black:#000; --bone:#dcd4bb; } }
:root[data-theme="dark"]{ --black:#000; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; background:var(--black); color:var(--bone); font-family:var(--serif); overflow:hidden; user-select:none; -webkit-user-select:none; }
#wrap{ position:fixed; inset:0; background:#000; }
#gl{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
.layer{ position:absolute; inset:0; pointer-events:none; }
#fade{ background:#000; opacity:0; transition:opacity .45s linear; }
#vign{ background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(120,0,0,.85) 100%); opacity:0; }
#cross{ position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; display:none; }
#cross::before,#cross::after{ content:""; position:absolute; background:rgba(255,80,60,.9); }
#cross::before{ left:8px; top:0; width:2px; height:18px; } #cross::after{ top:8px; left:0; height:2px; width:18px; }
#cross.dot::before{ left:7px; top:7px; width:4px; height:4px; border-radius:50%; } #cross.dot::after{ display:none; }
#hudl{ position:absolute; left:18px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; align-items:flex-end; gap:12px; }
#ecgbox{ background:rgba(6,18,20,.72); border:1px solid var(--line); padding:4px 6px 2px; }
#ecgbox .st{ font-size:12px; letter-spacing:.08em; margin-bottom:2px; }
#wpn{ background:rgba(6,18,20,.72); border:1px solid var(--line); padding:6px 10px; min-width:120px; }
#wpn .n{ font-size:13px; color:var(--dim); } #wpn .a{ font-size:24px; font-weight:700; line-height:1.1; }
#prompt{ position:absolute; left:50%; bottom:28%; transform:translateX(-50%); font-size:16px; background:rgba(0,0,0,.55); padding:5px 14px; border:1px solid var(--line); display:none; white-space:nowrap; }
#prompt b{ color:var(--brass); }
#msg{ position:absolute; left:50%; bottom:calc(9% + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(760px,92vw); background:rgba(4,12,14,.86); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 22px; font-size:17px; line-height:1.75; display:none; }
#msg .more{ float:right; color:var(--dim); font-size:13px; margin-top:6px; }
#obj{ position:absolute; left:18px; top:calc(16px + env(safe-area-inset-top,0px)); max-width:min(440px,70vw); font-size:14px; line-height:1.6; background:rgba(4,12,14,.7); border-left:3px solid var(--brass); padding:6px 12px; opacity:0; transition:opacity .6s; }
#saveind{ position:absolute; right:18px; top:calc(16px + env(safe-area-inset-top,0px)); font-size:13px; color:var(--dim); opacity:0; transition:opacity .4s; }
#saveind::before{ content:""; display:inline-block; width:9px; height:9px; margin-right:7px; border:2px solid var(--brass); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; vertical-align:-1px; }
@keyframes spin{ to{ transform:rotate(360deg);} }
#aware{ position:absolute; left:50%; top:18%; transform:translateX(-50%); font-size:15px; color:#ff9a8a; opacity:0; letter-spacing:.1em; text-shadow:0 0 6px #000; }
#lockhint{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.7); border:1px solid var(--line); padding:14px 24px; font-size:16px; display:none; pointer-events:auto; cursor:pointer; }

/* screens */
.screen{ position:absolute; inset:0; display:none; pointer-events:auto; }
.screen.on{ display:flex; }
#title{ flex-direction:column; justify-content:center; padding-left:clamp(24px,9vw,140px); background:linear-gradient(90deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 80%); }
#title h1{ margin:0; font-size:clamp(46px,8.5vw,104px); font-weight:900; letter-spacing:.14em; line-height:1; color:#e9e2c8; text-shadow:0 2px 0 #3b0c0c, 0 0 28px rgba(0,0,0,.9); }
#title h2{ margin:.5em 0 2.2em; font-size:clamp(18px,2.4vw,28px); font-weight:700; letter-spacing:.6em; color:var(--blood); }
.menu{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.menu button, .btn{ font-family:var(--serif); background:none; border:none; color:var(--bone); font-size:20px; padding:6px 2px; cursor:pointer; letter-spacing:.12em; text-align:left; }
.menu button:hover,.menu button:focus-visible{ color:#fff; outline:none; text-shadow:0 0 10px rgba(187,152,82,.8); }
.menu button:hover::before,.menu button:focus-visible::before{ content:"▸ "; color:var(--brass); }
.menu button[disabled]{ color:#555; cursor:default; }
.foot{ position:absolute; left:clamp(24px,9vw,140px); bottom:calc(22px + env(safe-area-inset-bottom,0px)); font-size:12px; color:#6f7466; max-width:560px; line-height:1.7; }

#modal{ align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
.win{ background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); box-shadow:0 0 0 4px rgba(0,0,0,.6); width:min(900px,94vw); max-height:88vh; overflow:auto; padding:20px 24px; }
.win h3{ margin:0 0 12px; font-size:20px; letter-spacing:.2em; color:var(--brass); font-weight:700; }
.tabs{ display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--line); }
.tabs button{ font-family:var(--serif); background:none; border:none; border-bottom:2px solid transparent; color:var(--dim); font-size:16px; padding:6px 14px; cursor:pointer; }
.tabs button.on{ color:var(--bone); border-bottom-color:var(--brass); }
.inv{ display:grid; grid-template-columns:240px 1fr; gap:18px; }
.grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; align-content:start; }
.slot{ height:62px; border:1px solid var(--line); background:rgba(0,0,0,.35); font-size:13px; line-height:1.3; padding:5px; cursor:pointer; position:relative; font-family:var(--serif); color:var(--bone); text-align:left; }
.slot .q{ position:absolute; right:5px; bottom:3px; font-size:14px; color:var(--ecg); font-weight:700; }
.slot.key{ border-color:#5c4b25; color:#e2cf9c; }
.slot.sel,.slot:focus-visible{ outline:2px solid var(--brass); outline-offset:-2px; }
.slot.eq::after{ content:"装备"; position:absolute; left:5px; bottom:3px; font-size:11px; color:var(--brass); }
.desc{ min-height:80px; font-size:15px; line-height:1.7; color:var(--bone); margin-top:10px; }
.acts{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
.acts button, .pbtn{ font-family:var(--serif); background:rgba(0,0,0,.3); border:1px solid var(--line); color:var(--bone); padding:6px 14px; font-size:15px; cursor:pointer; }
.acts button:hover,.pbtn:hover,.acts button:focus-visible,.pbtn:focus-visible{ border-color:var(--brass); outline:none; }
.stat{ font-size:14px; color:var(--dim); line-height:1.8; }
.stat b{ color:var(--bone); font-weight:700; }
.file{ font-size:16px; line-height:1.95; white-space:pre-wrap; background:#d9d2bb; color:#1d1a14; padding:22px 26px; max-width:640px; margin:0 auto; box-shadow:0 6px 0 rgba(0,0,0,.4); }
.file h4{ margin:0 0 10px; font-size:18px; }
.flist{ display:flex; flex-direction:column; gap:4px; }
.flist button{ font-family:var(--serif); text-align:left; background:rgba(0,0,0,.3); border:1px solid var(--line); color:var(--bone); padding:6px 10px; font-size:15px; cursor:pointer; }
#mapc{ width:100%; max-width:820px; background:#071517; border:1px solid var(--line); display:block; margin:0 auto; }
.floors{ display:flex; gap:6px; margin-bottom:10px; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.vend{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.vend button{ font-family:var(--serif); background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--bone); padding:12px; font-size:16px; cursor:pointer; text-align:left; }
.vend button small{ display:block; color:var(--dim); font-size:13px; margin-top:4px; }
.vend button[disabled]{ opacity:.4; cursor:default; }
.keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:8px; justify-content:center; margin-top:10px; }
.keypad button{ font-family:var(--serif); height:52px; font-size:22px; background:#10272b; color:var(--bone); border:1px solid var(--line); cursor:pointer; }
.kpd{ text-align:center; font-size:34px; letter-spacing:.5em; background:#041012; color:#7fe07a; border:1px solid var(--line); padding:8px; width:260px; margin:0 auto; font-weight:700; min-height:60px; }
.clocks{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center; }
.clocks canvas{ width:100%; max-width:150px; background:#0a1a1c; border:1px solid var(--line); border-radius:50%; }
.clocks .cn{ font-size:17px; margin:6px 0 2px; } .clocks .pl{ font-size:13px; color:var(--brass); }
.center{ text-align:center; }
.big{ font-size:clamp(40px,7vw,80px); font-weight:900; letter-spacing:.3em; }
.red{ color:var(--blood); }
.note{ color:var(--dim); font-size:14px; line-height:1.7; }
kbd{ font-family:var(--serif); border:1px solid var(--line); padding:0 6px; font-size:13px; background:rgba(0,0,0,.4); }
.ctrl{ display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:15px; }
#fade{ z-index:5; } #msg{ z-index:10; } #lockhint{ z-index:12; } .screen{ z-index:20; } #prompt,#obj,#saveind{ z-index:8; }
@media (max-width:640px){ .inv{ grid-template-columns:1fr; } .clocks{ grid-template-columns:repeat(2,1fr);} }
@media (prefers-reduced-motion: reduce){ #saveind::before{ animation:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div class="layer" id="vign"></div>
  <div class="layer" id="hud">
    <div id="cross"></div>
    <div id="hudl">
      <div id="ecgbox"><div class="st" id="ecgst">FINE</div><canvas id="ecg" width="128" height="36"></canvas></div>
      <div id="wpn"><div class="n" id="wpnn">空手</div><div class="a" id="wpna">—</div></div>
    </div>
    <div id="prompt"></div>
    <div id="obj"></div>
    <div id="saveind">自动保存中</div>
    <div id="aware">……它们快要察觉到你了</div>
    <div id="msg"></div>
  </div>
  <div class="layer" id="fade"></div>
  <div id="lockhint">点击画面继续（鼠标控制视角）</div>
  <div class="screen" id="title">
    <h1>银行危机</h1>
    <h2>宝安支行</h2>
    <div class="menu" id="tmenu"></div>
    <div class="foot">建议使用电脑键盘+鼠标游玩。W A S D 移动，Shift 奔跑，鼠标转动视角，右键瞄准，左键射击/攻击，E 调查，Tab 物品栏，M 地图。</div>
  </div>
  <div class="screen" id="modal"><div class="win" id="win"></div></div>
</div>
