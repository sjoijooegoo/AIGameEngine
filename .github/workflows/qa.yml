name: Legacy sandbox QA (manual only)
# The user retired automatic legacy-world testing on 2026-10-07.
# Current bank work uses targeted game/tests checks, not this legacy suite.
on: [workflow_dispatch]
jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine and Python dependency
        shell: pwsh
        run: ./engine/tools/setup.ps1
      - run: ./.venv/Scripts/python.exe -m unittest discover -s engine/tests -p "test_*.py" -v
      - run: ./.venv/Scripts/python.exe engine/run.py project
      - run: ./.venv/Scripts/python.exe engine/run.py qa --headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-qa-evidence
          path: logs/
  # Run rendered QA on a GPU-equipped workstation. Headless CI is not visual validation.
