name: Game logic and test framework
on: [push, pull_request, workflow_dispatch]
jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine and Python dependency
        shell: pwsh
        run: ./tools/setup.ps1
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python tools/qa.py --headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-qa-evidence
          path: artifacts/
  # Run rendered QA on a GPU-equipped workstation. Headless CI is not visual validation.
